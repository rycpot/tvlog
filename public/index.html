<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tvlog</title>
  <meta name="description" content="What I'm watching, planning to watch, finished and dropped.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Set the layout classes before the first paint, so the header doesn't
    // jump when app.js learns who is viewing. app.js corrects them if needed.
    try {
      const root = document.documentElement;
      root.classList.toggle('home', !/^\/show\//.test(location.pathname) && !location.hash.startsWith('#/show/'));
      root.classList.add(localStorage.getItem('tvlog-owner') === '1' ? 'owner' : 'public');
    } catch {}
    // Start the first data requests now, while app.js is still downloading.
    const show = location.pathname.match(/^\/show\/(\d+)/);
    window.preloaded = Object.fromEntries((show ? ['/api/session', `/api/shows/${show[1]}`] : ['/api/state'])
      .map((path) => [path, fetch(path)]));
  </script>
</head>
<body>
  <header class="wrap top">
    <a class="logo" href="/">tvlog<span>.</span></a>
    <div class="top-right">
      <div class="search" id="search" hidden>
        <label>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="sr">Search shows</span>
          <input id="q" type="search" placeholder="Search shows to add" autocomplete="off" spellcheck="false">
        </label>
        <div class="results" id="results" hidden></div>
      </div>
      <button class="link" id="auth" type="button" hidden>Sign out</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <dialog id="login">
    <form id="login-form" method="dialog">
      <h2>Sign in</h2>
      <label for="password" class="label">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p class="error" id="login-error" role="alert"></p>
      <div class="actions">
        <button class="link" type="button" id="login-cancel">Cancel</button>
        <button class="btn" type="submit">Sign in</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
